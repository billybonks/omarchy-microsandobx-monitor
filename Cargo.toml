[package]
name = "omarchy-microsandbox"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local microsandbox management backend for an Omarchy bar widget"

[[bin]]
name = "microsandbox-panel"
path = "src/main.rs"

[dependencies]
microsandbox = { version = "=0.7.11", default-features = false, features = ["local", "net", "keyring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
strip = true
lto = "thin"
